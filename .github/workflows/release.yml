name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches VERSION
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          file_version=$(tr -d '[:space:]' < VERSION)
          if [[ "$file_version" != "$version" ]]; then
            echo "标签 ${tag} 与 VERSION（${file_version}）不一致。请推送与 VERSION 相同的 vX.Y.Z。"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Read changelog section
        run: bash scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
